<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Triage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1>Tab Triage</h1>
      <p class="dateline" id="dateline"></p>
    </div>
    <div class="instruments" id="instruments"></div>
    <div class="actions">
      <button class="btn" data-action="sweep-now" title="Save and sort every unprotected tab now. Asks before acting.">Sweep now</button>
      <button class="btn ghost" data-action="tidy" title="Move tabs into at most two windows. Closes nothing.">Merge windows</button>
      <button class="btn ghost" data-action="export" title="Download the list as a Markdown file.">Export .md</button>
      <button class="btn ghost icon" data-action="toggle-settings" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>

  <div id="banners"></div>

  <nav class="views" id="views">
    <button data-view="themes">Themes</button>
    <button data-view="open">Open tabs</button>
    <button data-view="snoozed">Snoozed</button>
    <button data-view="completed">Completed</button>
  </nav>

  <main id="main"></main>

  <aside class="settings" id="settings" hidden></aside>
  <div class="popover" id="popover" hidden></div>
  <div class="top-drop" data-zone="ranked">Drop here to make it #1</div>
  <div class="bulkbar" id="bulkbar" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
